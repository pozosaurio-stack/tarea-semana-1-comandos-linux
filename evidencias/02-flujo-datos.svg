<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1110" viewBox="0 0 800 1110" role="img" aria-labelledby="title desc">
  <title id="title">Redirección de notas, adición del recordatorio del audio e historial con tee</title>
  <desc id="desc">Diagrama teórico de la práctica. cat y el operador mayor que copian los tres recordatorios de notas.txt a resumen.txt. echo y el doble mayor que añaden el recordatorio de grabar el audio. history conectado con tee muestra el historial y lo guarda en tarea-s1-pedro_pozo.txt. No es una captura ni una evidencia de ejecución.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52718b"/></marker>
  </defs>
  <rect width="800" height="1110" fill="#f5f8fc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="43" font-size="25" font-weight="700" fill="#16334b">Cómo se dirige la salida de los comandos</text>
    <text x="32" y="72" font-size="12.5" font-weight="600" fill="#526b80">DIAGRAMA TEÓRICO · Ejemplos de la práctica, no capturas de ejecución</text>

    <rect x="28" y="100" width="744" height="288" rx="16" fill="#ffffff" stroke="#cddbe7"/>
    <text x="48" y="132" font-size="20" font-weight="700" fill="#16334b">1. &gt;  Copiar las notas a resumen.txt</text>
    <text x="48" y="166" font-size="14" font-family="Consolas, monospace" fill="#173e60">cat documentos/notas.txt &gt; documentos/resumen.txt</text>
    <text x="48" y="192" font-size="13" fill="#526b80">El contenido de notas.txt se escribe en el archivo de destino.</text>

    <rect x="48" y="214" width="152" height="120" rx="8" fill="#eef4fb"/>
    <text x="64" y="237" font-size="11" font-weight="700" fill="#526b80">ANTES</text>
    <text x="64" y="263" font-size="14" font-family="Consolas, monospace" fill="#16334b">resumen.txt</text>
    <text x="64" y="294" font-size="16" fill="#16334b">Vacío</text>
    <path d="M214 274 H252" fill="none" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="268" y="214" width="484" height="120" rx="8" fill="#e4f3ed"/>
    <text x="284" y="237" font-size="11" font-weight="700" fill="#32654f">DESPUÉS · resumen.txt</text>
    <text x="284" y="264" font-size="14" fill="#225640">Revisar el historial antes de subirlo.</text>
    <text x="284" y="288" font-size="14" fill="#225640">Guardar el informe en Markdown.</text>
    <text x="284" y="312" font-size="14" fill="#225640">Adjuntar el enlace del repositorio en el aula.</text>
    <text x="48" y="365" font-size="13" fill="#526b80">Si el destino no existe, se crea. Si contiene texto, &gt; lo reemplaza.</text>

    <rect x="28" y="406" width="744" height="344" rx="16" fill="#ffffff" stroke="#cddbe7"/>
    <text x="48" y="439" font-size="20" font-weight="700" fill="#16334b">2. &gt;&gt;  Añadir el recordatorio del audio</text>
    <text x="48" y="477" font-size="14" font-family="Consolas, monospace" fill="#173e60">echo "Grabar un audio de un minuto para la entrega." \</text>
    <text x="66" y="501" font-size="14" font-family="Consolas, monospace" fill="#173e60">&gt;&gt; documentos/resumen.txt</text>
    <text x="48" y="528" font-size="13" fill="#526b80">La barra invertida continúa el mismo comando en la siguiente línea.</text>

    <rect x="48" y="548" width="152" height="156" rx="8" fill="#eef4fb"/>
    <text x="64" y="572" font-size="11" font-weight="700" fill="#526b80">ANTES</text>
    <text x="64" y="598" font-size="14" font-family="Consolas, monospace" fill="#16334b">resumen.txt</text>
    <text x="64" y="631" font-size="15" fill="#16334b">3 recordatorios</text>
    <path d="M214 625 H252" fill="none" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="268" y="548" width="484" height="156" rx="8" fill="#e4f3ed"/>
    <text x="284" y="572" font-size="11" font-weight="700" fill="#32654f">DESPUÉS · resumen.txt</text>
    <text x="284" y="599" font-size="14" fill="#225640">Revisar el historial antes de subirlo.</text>
    <text x="284" y="623" font-size="14" fill="#225640">Guardar el informe en Markdown.</text>
    <text x="284" y="647" font-size="14" fill="#225640">Adjuntar el enlace del repositorio en el aula.</text>
    <text x="284" y="677" font-size="14" font-weight="700" fill="#225640">Grabar un audio de un minuto para la entrega.</text>
    <text x="48" y="733" font-size="13" fill="#526b80">Se mantienen los tres recordatorios y se añade el del audio.</text>

    <rect x="28" y="768" width="744" height="320" rx="16" fill="#ffffff" stroke="#cddbe7"/>
    <text x="48" y="800" font-size="20" font-weight="700" fill="#16334b">3. | y tee  Mostrar y guardar el historial</text>
    <text x="48" y="833" font-size="15" font-family="Consolas, monospace" fill="#173e60">history | tee ../tarea-s1-pedro_pozo.txt</text>

    <rect x="48" y="886" width="166" height="70" rx="10" fill="#eef4fb" stroke="#b9cde0"/>
    <text x="131" y="915" text-anchor="middle" font-size="20" font-family="Consolas, monospace" font-weight="700" fill="#173e60">history</text>
    <text x="131" y="938" text-anchor="middle" font-size="13" fill="#526b80">produce el historial</text>
    <path d="M214 920 H314" fill="none" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="264" y="899" text-anchor="middle" font-size="13" fill="#526b80">tubería |</text>

    <rect x="316" y="886" width="160" height="70" rx="10" fill="#16334b"/>
    <text x="396" y="915" text-anchor="middle" font-size="20" font-family="Consolas, monospace" font-weight="700" fill="#ffffff">tee</text>
    <text x="396" y="938" text-anchor="middle" font-size="13" fill="#ffffff">copia su entrada</text>

    <path d="M476 920 H522 V882 H565 M522 920 V986 H565" fill="none" stroke="#52718b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="568" y="855" width="184" height="56" rx="8" fill="#e4f3ed" stroke="#b9d9ca"/>
    <text x="660" y="889" text-anchor="middle" font-size="16" font-weight="700" fill="#225640">Pantalla</text>

    <rect x="568" y="946" width="184" height="78" rx="8" fill="#e4f3ed" stroke="#b9d9ca"/>
    <text x="660" y="969" text-anchor="middle" font-size="14" font-weight="700" fill="#225640">Archivo</text>
    <text x="660" y="990" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#225640">tarea-s1-</text>
    <text x="660" y="1009" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#225640">pedro_pozo.txt</text>
    <text x="48" y="1050" font-size="13" fill="#526b80">tee sobrescribe el archivo por defecto; tee -a agrega al final.</text>
    <text x="48" y="1073" font-size="13" fill="#526b80">La ruta ../ guarda el archivo un nivel por encima de proyecto_comandos.</text>
  </g>
</svg>

